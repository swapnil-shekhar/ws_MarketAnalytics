# DAB Job: Bronze to Silver Standardization (Python/PySpark)
resources:
  jobs:
    standardization_job:
      tasks:
        - task_key: standardize_stock_prices
          notebook_task:
            notebook_path: /Workspace${workspace.root_path}/python/standardization/03_standardize_stock_prices
            source: WORKSPACE
          environment_key: default
        - task_key: standardize_ticker_dim
          depends_on:
            - task_key: standardize_stock_prices
          notebook_task:
            notebook_path: /Workspace${workspace.root_path}/python/standardization/04_standardize_ticker_dim
            source: WORKSPACE
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
      schedule:
        quartz_cron_expression: "0 30 22 * * ?"
        timezone_id: UTC