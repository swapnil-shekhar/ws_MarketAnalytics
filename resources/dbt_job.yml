# DAB Job: Silver to Gold (dbt run + test)
resources:
  jobs:
    dbt_job:
      tasks:
        - task_key: install_dbt
          notebook_task:
            notebook_path: /Workspace${workspace.root_path}/python/setup/05_install_dbt
            source: WORKSPACE
          environment_key: default
        - task_key: dbt_deps
          depends_on:
            - task_key: install_dbt
          notebook_task:
            notebook_path: /Workspace${workspace.root_path}/python/setup/06_dbt_deps
            source: WORKSPACE
          environment_key: default
        - task_key: dbt_run
          depends_on:
            - task_key: dbt_deps
          notebook_task:
            notebook_path: /Workspace${workspace.root_path}/python/setup/07_dbt_run
            source: WORKSPACE
          environment_key: default
        - task_key: dbt_test
          depends_on:
            - task_key: dbt_run
          notebook_task:
            notebook_path: /Workspace${workspace.root_path}/python/setup/08_dbt_test
            source: WORKSPACE
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - dbt-databricks==1.8.0
      schedule:
        quartz_cron_expression: "0 0 23 * * ?"
        timezone_id: UTC